Taster Facial.","opts":[["1 hr 20 mins",135]]},{"n":"Heaven & Earth","d":"This treatment package begins with a Traditional Balinese Massage to unwind and is followed with a Refresher Facial to leave you glowing.","opts":[["1 hr 20 mins",120]]}]},{"t":"Massage","k":"Massage","items":[{"n":"Chavana Massage","d":"Chavana’s signature massage is a fusion of global techniques performed by two therapists at the one time.","opts":[["1 hr 30 mins",185],["1 hr",145]]},{"n":"Tension Relief Massage","d":"Slow, deep massage strokes deliver pressure to muscles and connective tissue to ease tightly-held tension. Relieves pain and boosts circulation.","opts":[["1 hr 30 mins",170]]},{"n":"Asian Head Massage","d":"A deeply relaxing shoulder, neck, upper back, arm and scalp massage to improve circulation and relieve headache.","opts":[["1 hr 30 mins",170],["1 hr",135]]},{"n":"Traditional Balinese Massage","d":"Passed down through the generations this massage is designed to loosen tight muscles and improve energy flow through the body.","opts":[["1 hr 30 mins",155],["1 hr",120]]},{"n":"Asian Foot Massage","d":"Inspired by a selection of different Asian massage styles, this combination of strokes stimulates circulation, relieves tired and painful feet.","opts":[["1 hr",120]]}]},{"t":"Facials","k":"Facials","items":[{"n":"Purity Facial","d":"Inspired by the tropical garden, this botanical rich facial treatment delivers cleaner, healthier, and smoother skin.","opts":[["1 hr",120]]},{"n":"ELEMIS Pro-Glow Smooth","d":"Improve skin-fitness and firmness, whilst reducing fine lines and wrinkles with our clinically proven formulas and signature skin-lifting massage techniques. After just one treatment, the complexion looks firmer, supremely smooth and rejuvenated.","opts":[["1 hr",145]]},{"n":"ELEMIS Pro-Glow Brilliance","d":"Nourish and glow with this brightness-boosting facial, reviving dull, lacklustre skin. A fusion of Superfoods and antioxidant-rich facial oils plump the skin with moisture, whilst helping to nourish and protect.","opts":[["1 hr",130]]}]},{"t":"Body Treatments","k":"Body","items":[{"n":"ELEMIS Body Nectar Nourishing Wrap – Frangipani","d":"The velvety texture of the Monoi Oil offers super-hydration, quenching a thirsty skin. You are kept cocooned and warm while the mood-balancing aromatics and skin conditioning oils do their work.","opts":[["45 mins",105]]},{"n":"ELEMIS Intensely Cleansing Salt Scrub - Lime and Ginger","d":"Fragranced salt will gently slough away dead skin cells, encouraging the regeneration of new cells. It leaves a smooth and responsive canvas, ready to absorb the deeply nourishing body oil.","opts":[["45 mins",105]]}]},{"t":"Hands & Feet","k":"Hands & Feet","intro":"A Spa treatment designed for the hands and feet. Includes a hand or foot soak, nail care, nail colour and a relaxing hand and arm or lower leg massage.","items":[{"n":"Spa Pedicure Power Polish","d":"","opts":[["1 hr 15 mins",100]]},{"n":"Spa Manicure Power Polish","d":"","opts":[["1 hr",80]]},{"n":"Spa Pedicure","d":"","opts":[["1 hr 15 mins",90]]},{"n":"Spa Manicure","d":"","opts":[["1 hr",70]]},{"n":"Gel Polish Removal","d":"","opts":[["30 mins",35]]}]}],"spax":{"cover":"Ellaidhoo Maldives by Cinnamon","extras":[["Gift Certificate","Gift certificate purchase is available for all Spa treatments or at a value amount. Please contact our Spa Reception for further details."],["Homecare & Gifts","Luxury skin and body care products along with beautiful gifts are available at our Spa Boutique."]],"foot":"All prices are quoted in US Dollars (USD) and inclusive of 10% Service Charge and 17% Tourism, Goods and Service Tax. Rates are subject to change without notice.","basics":[["Should I reserve my treatments?","Yes, either phone or visit the Spa to book a reservation at your earliest convenience so we may accommodate your schedule."],["When should I arrive?","Please arrive at the Spa 15 minutes before the scheduled time to check-in and change."],["What if I have special health considerations?","Please notify our Spa Manager or Receptionist before booking your treatments if you have high blood pressure, allergies, other physical ailments or disabilities, or if you are pregnant. If you have any concern at all, let us know."],["What if I’m late for my appointment?","Arriving late will simply limit the time for your treatment, thus lessening its effectiveness and your pleasure. Your treatment will end on time so that the next guest is not delayed."],["What do I wear during my treatment?","You may wish to wear your own bikini or briefs, or we can provide you with hygienic disposable briefs. Choose what is most comfortable for you. Our therapists will always use draping techniques to respect your privacy."],["What about my valuables?","We advise guests not to bring valuables to the Spa as we do not accept liability for loss. For all other personal items we provide lockers."],["What if I need to cancel a Spa reservation?","The treatments you select are reserved especially for you. Guests will be charged 50% for treatments not cancelled six hours in advance."],["What about payment for Spa services?","You may charge Spa services to your hotel bill. We accept all major credit cards (Visa, AmEx, MC, JCB)"]],"name":"Chavana Spa","addr":["Ellaidhoo Maldives by Cinnamon","North Ari Atoll","Republic of Maldives"],"tel":"+960 6660 586 Ext. 7726","telh":"+9606660586,7726","fax":"+960 6660 514","mail":"ellaidhoo@chavanaspa.com","web":"www.chavanaspa.com"},"spapages":[],"act":{"Sunday":[["11:00–11:45","Zumba Dance","Pool Deck"],["16:30–17:30","Beach Volleyball Tournament","Game Zone"]],"Monday":[["11:00–11:45","Art of Massage","Mandara Spa"],["16:30–17:30","Trial Diving","Lagoon (pickup at the Dive Center)"]],"Tuesday":[["11:00–11:45","Traditional Maldivian Handicraft Lessons","Iru Kitchen & Bar"],["16:30–17:30","Pool Party","Pool Deck"]],"Wednesday":[["11:00–11:45","Live Cooking with Chef","Iru Kitchen & Bar (All Inclusive guests only)"], ces include 10% service charge and 17% GST."]],"rules":["Resident guests shall not be permitted to entertain non resident guests in their rooms. Non resident guests may only use the Resort facilities with the prior approval of Management.","Guests shall not use the Resort for any illegal purposes or act in a manner that may cause a disturbance.","Any loss or damage to Resort property attributable to a guest will be charged to the guest’s bill.","Spa, dive centre, shop and other facilities or services are availed at the guest’s own expense and risk; third-party activities likewise.","Guests are required to return all room keys before departure; failure to do so is charged.","All Inclusive guests pay for: imported liquor; à la carte and Pool Bar menu food & beverages (as per package); special F&B promotions at a supplementary charge; room service; bills of non resident visitors.","The Safety Deposit Box may not be used for illegal purposes or for dangerous or offensive goods.","Pets are not allowed at the Resort premises.","Drones are not permitted (seaplane operations and guest privacy).","Cooking in the room is strictly prohibited. No smoking in the room / suite.","The Maldives is predominantly an Islamic country, so the resort cannot provide legal services for weddings. An Islamic Prayer Room is provided on the island; prayer mat and the Holy Quran are available."],"safety":["Children must be supervised by an adult at all times, including on balconies / sundecks. Do not climb or stand on balcony furniture.","Never swim alone. Swimming at night is not recommended. Snorkelling alone is not recommended.","Be aware of rip currents and strong tides; beware of strong currents and submerged rocks. Wear life vests while snorkelling / swimming and stay close to the shoreline.","Wear coral shoes while out at sea. Do not touch or step on coral. Damaging or removing coral or fish from the ocean is punishable by Maldivian law.","Nude bathing is prohibited and is punishable by Maldivian law.","Bathroom surfaces can be slippery from condensation and water spray. Do not keep the balcony door open while air conditioning is on.","Fire: press 0 (Service Centre) and report the location and number of people. Pull the nearest alarm call point if you discover a fire. Take your room key and go to the nearest fire assembly point. Your evacuation plan hangs behind the room door.","If trapped in your room: call 0, wedge wet towels under the door, signal from the window."],"sust":{"t":"Treasure the waters of the Vaavu Atoll","p":["Corals are living animals. Most corals grow only 1–2 inches per year and are extremely fragile.","When swimming, snorkelling or diving: do not touch corals, clams or shells; do not stand on corals; do not remove dead corals or rocks from the ocean; respect the home of marine life – you are a visitor there.","Safety first: if you are not a confident snorkeler or swimmer, wear a life jacket or seek assistance from the dive centre.","Let’s work together to protect and preserve it for future generations. Thank you for your cooperation."]},"contacts":[{"n":"Room phone – Service Centre / emergency","v":"Dial 0","tel":""},{"n":"Room phone – Reception","v":"Ext. 650 or 666","tel":""},{"n":"Mandara Spa","v":"+960 3336 000 · Ext. 618","tel":"+9603336000,618","mail":"CINNAMONVELIFUSHI@MANDARASPA.COM"},{"n":"Weddings & dining enquiries","v":"+960 670 6000","tel":"+9606706000","mail":"fb.velifushi@cinnamonhotels.com"}],"index":[{"s":"All Day Dining","t":"Continental Breakfast","x":"$30 · Selection of Fresh Juices (Orange, Pineapple, Papaya or Watermelon) Freshly Cut Fruits Baker’s Basket wi","h":"#/menu/allday","k":"all day dining continental breakfast $30 · selection of fresh juices (orange, pineapple, papaya or watermelon) freshly cut fruits baker’s basket with butter, preserves, honey choice of cereals (muesli, all bran or corn flakes) choice hot beverages (tea, coffee or hot chocolate) breakfast (8.00 am – noon) "},{"s":"All Day Dining erbal and domestic flavour, leading to a perfect balance.","p":10,"base":["Gin"]},{"n":"Pashorigna","ing":"Cachaça, Passion Pulp, Passion Fruit Syrup, Sour Mix","d":"Notice the sharp, tangy lime, immediately softened by the subtle sweetness of the passion fruit. Cachaça, with its robust, slightly woody undertone, makes it dance on the palate.","p":10,"base":["Cachaça"]},{"n":"Cuban Connection","ing":"Captain Morgan Rum, Cherry Brandy, Orgeat Syrup, Orange Juice, Lime","d":"The full flavoured, rich rum is lightened by the gentle, smooth taste of almond. This charming concoction is made with fresh orange juice and seasoned with sour mix.","p":10,"base":["Rum"]},{"n":"Tiramisu Martini","ing":"Captain Morgan Rum, Kahlúa, Frangelico, Cream, Nutmeg","d":"Rich rum with nutty, sweet, and spice notes with Frangelico and coffee liqueur.","p":10,"base":["Rum"]},{"n":"La Sangria","ing":"Red Wine, Peach Liqueur, Elderflower, Mixed Fruits, Soda Water","d":"A simple and refreshing beverage laced with fresh fruit and Elderflower.","p":10,"base":["Wine"]}]},{"t":"Refresh and revive, zero - ABV","items":[{"n":"Market Punch","ing":"Fresh Passion Fruit Juice, Caramel Syrup, Ginger Beer","d":"","p":8,"base":[]},{"n":"Mango Mule","ing":"Mango Purée, Honey, Ginger Beer","d":"","p":8,"base":[]},{"n":"Coconut Avenue","ing":"Pineapple Juice, Mango Juice, Coconut Purée, Coconut Water","d":"","p":8,"base":[]}]}]},"mule":{"label":"Signature Cocktail","title":"Cinnamon","script":"Mule","lead":"The story of the Cinnamon Mule begins long before the first pour","paras":[{"ic":1,"b":"","t":"At dawn in Sri Lanka, toddy tappers climb towering coconut palms using age-old rope techniques passed down through generations, moving gracefully from tree to tree as they harvest fresh coconut sap in the quiet morning light. The sap is then slowly fermented and distilled into smooth coconut arrack, traditionally matured in prized Halmilla wood vats to deepen its character and warmth."},{"ic":2,"b":"At Cinnamon Velifushi Maldives, this island spirit finds a new home.","t":"Infused with fragrant cinnamon sticks, brightened with fresh lime, and lifted with sparkling ginger, the Cinnamon Mule is a tropical reinterpretation of a timeless classic — bold yet mellow, vibrant yet smooth. Every element reflects the rhythm of the islands: the spice of Sri Lanka, the freshness of the Maldives, and the easy warmth of sunset hours at The Hub."},{"ic":3,"b":"","t":"Served chilled in a handcrafted coconut cup and saucer inspired by traditional Maldivian handicrafts, the experience is as much ritual as it is refreshment. In true island fashion, the cocktail may be gently poured into the saucer before sipping, allowing the aromas of cinnamon, citrus, and coconut arrack to open fully with the ocean breeze."},{"ic":4,"b":"","t":"As the sun melts into the endless blues of the Vaavu Atoll, each sip becomes more than a cocktail — it becomes a journey through craft, culture, and island heritage."}],"tag":"Bold. Tropical. Unmistakably Velifushi.","price":"USD 10 NETT","ingt":"Ingredients (per serving)","ing":[["Coconut Old Arrack (DD)","50 ml"],["Fresh Lime Juice","25 ml"],["Homemade Ginger Infused Soda Sparkling Water","100 ml"],["Cinnamon Syrup","10 ml"],["Angostura Bitters","3 drops"]],"feats":[["Rooted in tradition","A story from Sri Lanka’s coconut heritage"],["Island ingredients","Fresh, natural and full of flavour"],["Handcrafted experience",""],["Made for sunset hours","Best enjoyed with the ocean breeze"]]},"laun":{"title":"Unlimited laundry service options during your stay","tiers":[["3 nights stay",30],["4 - 5 nights stay",40],["6 - 7 nights stay",50],["8 nights stay or more",70]],"notes":["Washing garments inside the room is prohibited","Billing will be in accordance with the actual length of the stay"],"foot":"Prices are inclusive of 10% Service Charge and 17% GST"},"jk":{"title":"Traditions in a Glass","sub":"Refined Spirits of Japan and Korea","foot":"All Prices Are Inclusive of 10% const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd=p=>p==null?'':'$'+(Math.round(p*100)%100?p.toFixed(2):p);
// ---- Maldives time (UTC+5)
function mv(){const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Indian/Maldives',weekday:'long',hour:'2-digit',minute:'2-digit',hour12:false,day:'numeric',month:'short'}).formatToParts(new Date());const o={};f.forEach(x=>o[x.type]=x.value);return{day:o.weekday,min:(+o.hour%24)*60+ +o.minute,txt:`${o.weekday} ${o.day} ${o.month}, ${o.hour}:${o.minute}`}}
const fmt=m=>{let h=Math.floor(m/60)%24,mm=m%60,ap=h>=12?'pm':'am';h=h%12||12;return h+(mm?':'+String(mm).padStart(2,'0'):'')+' '+ap};
const hl=h=>h.l=='Daily'?'':h.l+' ';
function status(hours){const n=mv().min;for(const h of hours){if(n>=h.a[0]&&n<h.a[1])return{s:'open',t:`Open now · ${hl(h)}until ${fmt(h.a[1])}`}}
 const nx=hours.filter(h=>h.a[0]>n).sort((a,b)=>a.a[0]-b.a[0])[0];
 if(nx)return{s:(nx.a[0]-n<=60?'soon':'closed'),t:`Closed · ${hl(nx)}opens ${fmt(nx.a[0])}`};
 return{s:'closed',t:`Closed · reopens tomorrow ${fmt(hours.slice().sort((a,b)=>a.a[0]-b.a[0])[0].a[0])}`}}
const badge=h=>{const s=status(h);return `<span class="badge ${s.s}">${s.t}</span>`}
const hrsHtml=h=>`<div class="hrs">${h.map(x=>`<div><span>${x.l}</span><span>${fmt(x.a[0])} – ${fmt(x.a[1])}</span></div>`).join('')}</div>`;

 SEGS.forEach((g,i)=>{const c=i*step,[x,y]=polar(161,c),[w,h]=ISZ[g[0]],ls=g[1].split('|');

 const Q=[['Compendium','#/compendium'],['Contacts','#/contacts']];
 if(/^(hi|hello|hey|hola|good (morning|evening|afternoon))\b/.test(q))return A(`Hello! I’m ${MILO_NAME}, your guide. Ask me about opening hours, activities, menus, the spa or excursions – or tap a suggestion below.`);

 // opening hours of a named venue
 if(/\b(open|opens|opening|close|closes|closing|hours?|time|times|when)\b/.test(q)){for(const [re,id] of VA){if(new RegExp('\\b('+re+')\\b').test(q)){const v=D.venues.concat(D.facilities).find(x=>x.id==id);if(v){const st=status(v.hours),nm=v.name.replace(/ \(.*/,'');return A(`${nm}: ${st.t}. All hours (Maldives time): ${v.hours.map(h=>`${h.l} ${fmt(h.a[0])} – ${fmt(h.a[1])}`).join(', ')}.`,[['Open '+nm.split(' ')[0],vroute(v)]].concat((v.menus||[]).slice(0,2).map(m=>[MENU[m].title.replace(/ \(.*/,''),'#/menu/'+m])).concat(v.mapno?[['Map','#/map/'+v.mapno]]:[]))}}}}
 // what is open now
 if(/(open now|what'?s open|currently open|open right now|open today|hungry|where .*eat)/.test(q)){const o=D.venues.concat(D.facilities).map(v=>({v,s:status(v.hours)})).filter(x=>x.s.s=='open');

 // schedule
 const dn=DAYS.find(d=>q.includes(d.toLowerCase()));
 if(dn||/(today|tonight|tomorrow|what'?s on|what is on|activit|entertain|happening|schedule|programme)/.test(q)){let d=dn||mv().day,lab=d==mv().day?'Today':d;if(/tomorrow/.test(q)){d=DAYS[(DAYS.indexOf(mv().day)+1)%7];lab='Tomorrow ('+d+')'}
