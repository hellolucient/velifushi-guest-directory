.back.pill{width:auto;border-radius:20px;padding:0 14px 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}

.tb svg{width:20px;height:20px}
.dial{width:min(94vw,58vh,640px);aspect-ratio:1;border-radius:50%;margin-bottom:14px;position:relative;box-shadow:0 0 0 2px rgba(120,225,255,.35),0 0 38px 8px rgba(70,215,255,.75),0 0 110px 26px rgba(40,190,255,.35),0 18px 40px rgba(0,0,0,.45);animation:dialin 1s cubic-bezier(.2,.8,.2,1) both,glow 4.5s ease-in-out 1s infinite}

.sg{cursor:pointer;outline:none}

.sg .gc{transition:transform .18s,filter .18s;transform-box:fill-box;transform-origin:center;animation:gin .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.45s + var(--i)*.07s)}
.sg:active .gc{transform:scale(1.1);filter:drop-shadow(0 0 5px #5fd4ff)}

.ctr .cd{transition:.18s}.ctr:active .cd{filter:brightness(1.35)}

.logo{width:min(42vw,180px);margin-top:4px;opacity:.96;animation:gin .8s both 1.1s}

#sheet{position:fixed;inset:0;background:rgba(3,12,40,.62);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}

/* ---- Milo the guide */
#milo{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom) + 72px);width:54px;height:58px;z-index:20;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 5px 7px rgba(0,0,0,.38)) drop-shadow(0 0 9px rgba(255,196,120,.28));animation:gin .7s both 1.6s}

#milo:focus-visible{outline:3px solid #7fd8ff;outline-offset:3px;border-radius:50%}
.milo-art{display:block;width:100%;height:100%}
.milo-art svg{display:block;width:100%;height:100%;overflow:visible}
.m-wrap{display:block;width:100%;height:100%;transform-origin:50% 92%;animation:mbob 3.8s ease-in-out infinite}
#milo.hop .m-wrap{animation:mhop .7s ease-out}
@keyframes mbob{0%,100%{transform:translateY(0) scale(1.04,.96)}50%{transform:translateY(-5px) scale(.97,1.04)}}
@keyframes mhop{0%{transform:scale(1.12,.86)}30%{transform:translateY(-16px) scale(.92,1.1)}62%{transform:translateY(0) scale(1.1,.9)}100%{transform:scale(1)}}
.m-sh{transform-origin:60px 116px}
.m-pup{transition:transform .14s ease-out}
.m-blink{transform-origin:60px 70px;transition:transform .08s}
.blink .m-blink{transform:scaleY(.07)}

.sleepy.blink .m-blink{transform:scaleY(.07)}
.m-happy,.m-mouth-h,.m-mouth-s,.m-cos,.m-z,.m-poof{display:none}
.happy .m-eyes,.happy .m-mouth{display:none}.happy .m-happy,.happy .m-mouth-h{display:inline}
.sleepy:not(.happy) .m-mouth{display:none}.sleepy:not(.happy) .m-mouth-s{display:inline}.sleepy:not(.happy) .m-z{display:inline}
.cos-snorkel .m-c-snorkel{display:inline}.cos-spa .m-c-spa{display:inline}.cos-chef .m-c-chef{display:inline}.cos-party .m-c-party{display:inline}.cos-wedding .m-c-wedding{display:inline}.cos-reef .m-c-reef{display:inline}.cos-magnifier .m-c-magnifier{display:inline}.cos-explorer .m-c-explorer{display:inline}.cos-night .m-c-night{display:inline}

@keyframes mpoof{0%{opacity:.95;transform:scale(.2)}60%{opacity:.8}100%{opacity:0;transform:scale(1.9)}}
.m-conf{animation:mtw 1.4s ease-in-out infinite alternate}.m-hrt{animation:mfl 2.2s ease-in-out infinite}.m-fish{animation:mfl 2.6s ease-in-out infinite}
@keyframes mtw{from{transform:translateY(0)}to{transform:translateY(3px)}}@keyframes mfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#mchat .ver{margin-top:4px;font-size:10.5px;color:#7d90a8}

assic Tom Collins with Elderflower and Blue Butterfly Pea.","p":10.0,"nett":false},{"n":"The Blond","d":"Dry Gin, White Wine, Curry Leaves, Elderflower, Vanilla Floral and fresh aperitif beverage intensified by Elderflower and Chardonnay, adding a refreshing kick.","p":10.0,"nett":false},{"n":"Ceylon Old Fashioned","d":"VX Arrack, Orange Bitters, Brown Sugar Fresh orange extract spiked with finest coconut spirit.","p":10.0,"nett":false},{"n":"Above & Beyond","d":"Double Distilled Arrack, Blue Curaçao, Coconut Water, Lime, topped with Sprite. The traditional coconut Arrack is utilised to clarify this complex mixture. A light yet adds a sparkling finish to a drink that feels like summer.","p":10.0,"nett":false},{"n":"Aztec Mai - Tai","d":"Captain Morgan Rum, Pineapple Juice, Orgeat Syrup, Sour Mix, Angostura Bitter A staple of tiki culture. The name “Mai Tai” means “good” or “out of this world” in Tahitian. It is aimed to highlight the quality of Jamaican rum, resulting in a strong yet fresh beverage that is both lively and light.","p":10.0,"nett":false},{"n":"Cinnamon Mule","d":"Coconut Old Arrack, Cinnamon, Ginger Beer, Angostura Bitter, Lime A drink that encourages creativity and experimentation. An effervescent version of a mule.","p":10.0,"nett":false},{"n":"Island Of Sanctuary","d":"Dry Gin, Curry Leaves, Sour Mix Classic sour gin inspired this creation. It is a refreshing spirit with curry leaves intensifying the herbal and domestic flavour, leading to a perfect balance.","p":10.0,"nett":false},{"n":"Pashorigna","d":"Cachaça, Passion Pulp, Passion Fruit Syrup, Sour Mix Notice the sharp, tangy lime, immediately softened by the subtle sweetness of the passion fruit. Cachaça, with its robust, slightly woody undertone, makes it dance on the palate.","p":10.0,"nett":false},{"n":"Cuban Connection","d":"Captain Morgan Rum, Cherry Brandy, Orgeat Syrup, Orange Juice, Lime The full flavoured, rich rum is lightened by the gentle, smooth taste of almond. This charming concoction is made with fresh orange juice and seasoned with sour mix.","p":10.0,"nett":false},{"n":"Tiramisu Martini","d":"Captain Morgan Rum, Kahlúa, Frangelico, Cream, Nutmeg Rich rum with nutty, sweet, and spice notes with Frangelico and coffee liqueur.","p":10.0,"nett":false},{"n":"La Sangria","d":"Red Wine, Peach Liqueur, Elderflower, Mixed Fruits, Soda Water A simple and refreshing beverage laced with fresh fruit and Elderflower.","p":10.0,"nett":false}],"note":"Signature Cocktail & Mocktail Menu"},{"t":"Refresh and revive (zero ABV)","items":[{"n":"Market Punch","d":"Fresh Passion Fruit Juice, Caramel Syrup, Ginger Beer","p":8.0,"nett":false},{"n":"Mango Mule","d":"Mango Purée, Honey, Ginger Beer","p":8.0,"nett":false},{"n":"Coconut Avenue","d":"Pineapple Juice, Mango Juice, Coconut Purée, Coconut Water","p":8.0,"nett":false}],"note":""}],"pages":["img/sigmenu-1.webp","img/sigmenu-2.webp","img/sigmenu-3.webp"],"note":"","hours":"","src":"Signature cocktail menu.pdf"},{"id":"pai","title":"Premium All-Inclusive Beverage Menu","venue":"Resort bars","cat":"included","secs":[{"t":"Aperitifs (50 ml)","items":[{"n":"Campari","d":""},{"n":"Martini Dry","d":""},{"n":"Martini Bianco","d":""},{"n":"Martini Rosso","d":""},{"n":"Pernod Pimms","d":""},{"n":"Aperol","d":""}],"note":""},{"t":"Vodka (25 Ml)","items":[{"n":"Absolut","d":""},{"n":"Grey Goose","d":""},{"n":"Stolichnaya","d":""},{"n":"Finlandia","d":""},{"n":"Skyy","d":""},{"n":"Smirnoff","d":""}],"note":""},{"t":"Gin (25 Ml)","items":[{"n":"Beefeater","d":""},{"n":"Gordon’s","d":""},{"n":"Bombay Sapphire","d":""}],"note":""},{"t":"Rum (25 Ml)","items":[{"n":"Havana Club","d":""},{"n":"Bacardi White","d":""},{"n":"Captain Morgan","d":""},{"n":"Malibu","d":""}],"note":""},{"t":"Tequila (25 Ml)","items":[{"n":"Camino Silver","d":""}],"note":""},{"t":"Whisky Around The World (25 Ml)","items":[{"n":"Ballantine’s Finest","d":""},{"n":"Johnnie Walker B/Label","d":""},{"n":"Chivas Régal","d":""},{"n":"Jack Daniel's","d":"" ave it open at departure · Ext. 666 or 650"],["Departure information","Notified after 6 pm on the evening prior to departure · Ext. 666 or 650"],["Emergency / Service Centre","Press 0 on your room phone"]],"laundry":[["During your stay – unlimited laundry","Options by length of stay: 3 nights USD 30 · 4–5 nights USD 40 · 6–7 nights USD 50 · 8 nights or more USD 70"],["Notes","Washing garments inside the room is prohibited. Billing is in accordance with the actual length of stay. Prices include 10% service charge and 17% GST."]],"rules":["Resident guests shall not be permitted to entertain non resident guests in their rooms. Non resident guests may only use the Resort facilities with the prior approval of Management.","Guests shall not use the Resort for any illegal purposes or act in a manner that may cause a disturbance.","Any loss or damage to Resort property attributable to a guest will be charged to the guest’s bill.","Spa, dive centre, shop and other facilities or services are availed at the guest’s own expense and risk; third-party activities likewise.","Guests are required to return all room keys before departure; failure to do so is charged.","All Inclusive guests pay for: imported liquor; à la carte and Pool Bar menu food & beverages (as per package); special F&B promotions at a supplementary charge; room service; bills of non resident visitors.","The Safety Deposit Box may not be used for illegal purposes or for dangerous or offensive goods.","Pets are not allowed at the Resort premises.","Drones are not permitted (seaplane operations and guest privacy).","Cooking in the room is strictly prohibited. No smoking in the room / suite.","The Maldives is predominantly an Islamic country, so the resort cannot provide legal services for weddings. An Islamic Prayer Room is provided on the island; prayer mat and the Holy Quran are available."],"safety":["Children must be supervised by an adult at all times, including on balconies / sundecks. Do not climb or stand on balcony furniture.","Never swim alone. Swimming at night is not recommended. Snorkelling alone is not recommended.","Be aware of rip currents and strong tides; beware of strong currents and submerged rocks. Wear life vests while snorkelling / swimming and stay close to the shoreline.","Wear coral shoes while out at sea. Do not touch or step on coral. Damaging or removing coral or fish from the ocean is punishable by Maldivian law.","Nude bathing is prohibited and is punishable by Maldivian law.","Bathroom surfaces can be slippery from condensation and water spray. Do not keep the balcony door open while air conditioning is on.","Fire: press 0 (Service Centre) and report the location and number of people. Pull the nearest alarm call point if you discover a fire. Take your room key and go to the nearest fire assembly point. Your evacuation plan hangs behind the room door.","If trapped in your room: call 0, wedge wet towels under the door, signal from the window."],"sust":{"t":"Treasure the waters of the Vaavu Atoll","p":["Corals are living animals. Most corals grow only 1–2 inches per year and are extremely fragile.","When swimming, snorkelling or diving: do not touch corals, clams or shells; do not stand on corals; do not remove dead corals or rocks from the ocean; respect the home of marine life – you are a visitor there.","Safety first: if you are not a confident snorkeler or swimmer, wear a life jacket or seek assistance from the dive centre.","Let’s work together to protect and preserve it for future generations. Thank you for your cooperation."]},"contacts":[{"n":"Room phone – Service Centre / emergency","v":"Dial 0","tel":""},{"n":"Room phone – Reception","v":"Ext. 650 or 666","tel":""},{"n":"Mandara Spa","v":"+960 3336 000 · Ext. 618","tel":"+9603336000,618","mail":"CINNAMONVELIFUSHI@MANDARASPA.COM"},{"n":"Weddings & dining enquiries","v":"+960 670 6000","tel":"+9606706000","mail":"fb.velifushi@cinnamonhotels.com"}],"index":[{"s":"All Day Dining","t":"Contine function ask(q){q=q.trim();if(!q)return;say('mu',esc(q));const r=answer(q);say('mb',esc(r.t)+r.extra+(r.acts.length?`<div class="mact">${r.acts.map((a,i)=>`<a class="${i?'alt':''}" href="${a[1]}">${esc(a[0])}</a>`).join('')}</div>`:''));}
const CH=['What’s on today?','What’s open now?','What time is Marlin open?','Snorkelling price','Spa & 15% voucher','Spa massages','Wi-Fi'];
$('#mch').innerHTML=CH.map(c=>`<button type="button">${esc(c)}</button>`).join('');
$('#mch').addEventListener('click',e=>{const b=e.target.closest('button');if(b)ask(b.textContent)});
$('#mform').addEventListener('submit',e=>{e.preventDefault();const i=$('#mq2');ask(i.value);i.value=''});
lg.addEventListener('click',e=>{if(e.target.closest('a'))closeChat()});
const mm=$('#mmute');function mlab(){mm.textContent=muted()?`Speech bubbles are off – turn them on`:`Speech bubbles are on – mute ${MILO_NAME}`}mlab();
mm.onclick=()=>{ls.set('vf_milo_mute',muted()?'0':'1');mlab()};
let greeted=false,lastFocus;
function openChat(){hideBub();shown=true;lastFocus=document.activeElement;chat.hidden=false;document.body.classList.add('mchat-on');happyAv();if(!greeted){greeted=true;say('mb',`Hi, I’m ${MILO_NAME} 👋 your guide to Cinnamon Velifushi. Everything I say comes from this guide – ask me about hours, activities, menus, the spa or excursions.`)}chat.querySelector('.cl').focus()}
function happyAv(){const a=$('#mav');a.classList.add('happy');setTimeout(()=>a.classList.remove('happy'),1500)}
function closeChat(){if(chat.hidden)return;chat.hidden=true;document.body.classList.remove('mchat-on');if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}
chat.querySelector('.cl').onclick=closeChat;chat.addEventListener('click',e=>{if(e.target===chat)closeChat()});
addEventListener('keydown',e=>{if(e.key=='Escape'){closeChat();hideBub()}});
root.addEventListener('click',()=>{happy();if(chat.hidden)openChat()});
window.Milo={ask,openChat,costume:()=>curCos};
})();
</script></body></html>
